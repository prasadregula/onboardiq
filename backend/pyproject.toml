[project]
name = "onboardiq"
version = "0.1.0"
description = "OnboardIQ - agentic KYC / account onboarding platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "azure-identity>=1.17",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-storage-blob>=12.20",
    "azure-search-documents>=11.6.0b4",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set: ruff's defaults widened in later releases and CI installs the latest ruff.
select = ["E4", "E7", "E9", "F", "I"]
isort.known-first-party = ["app", "eval", "tests", "scripts"]
