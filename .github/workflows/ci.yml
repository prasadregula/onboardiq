name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - run: ruff check app eval tests scripts
      - run: python -m pytest -q
      - name: Eval gate (scripted baseline must be 100% on must_pass cases)
        run: python -m eval.run_eval --mode scripted
      - name: Retrieval gate (policy search quality + zero access leaks)
        run: python -m eval.retrieval_eval
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: backend/eval/reports/ }
      - name: Alembic migration is in sync with models
        run: |
          rm -f data/ci.db
          ONBOARDIQ_DATABASE_URL=sqlite:///./data/ci.db alembic upgrade head
          ONBOARDIQ_DATABASE_URL=sqlite:///./data/ci.db alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onboardiq-api:ci backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8080:8080 -e ONBOARDIQ_ENV=ci -e ONBOARDIQ_AUTH_MODE=apikey onboardiq-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/ready
          docker logs api | tail -20
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build -f infra/main.bicep
